  [[params.focusAreas]]
    title = "Credit Risk & Early Warning"
    description = "Probability-of-default and early-warning models for SME lending, from loan-tape ingestion to a monitored scoring service."

  [[params.focusAreas]]
    title = "Tabular Foundation Models"
    description = "TabPFN and TabICL in production: temporal validation, retrieved-context inference, and GPU serving."

  [[params.focusAreas]]
    title = "Explainability"
    description = "SHAP and surrogate-model explanations for every score, built for risk teams and model validation."

  [[params.focusAreas]]
    title = "Anomaly Detection Without Labels"
    description = "Unsupervised monitoring and predictive maintenance, with alarm thresholds calibrated on held-out time periods."

  [[params.focusAreas]]
    title = "Fraud Detection (Insurance)"
    description = "Claim-triage fraud models taken from feature engineering to a live insurance decision workflow."

  [[params.focusAreas]]
    title = "Time Series Forecasting"
    description = "Hierarchical demand forecasting for manufacturing and real-time audience forecasting for media."

  [[params.selectedWork]]
    title = "YesAlps Ski Booking Web App"
    domain = "Travel marketplace and geospatial product development"
    description = "Built a Java web app concept for YesAlps, inspired by Airbnb/Booking flows, with an interactive ski-slopes layer powered by self-scraped data."
    result = "Delivered an end-to-end prototype combining backend application logic, data collection, and map-based navigation."

  [[params.selectedWork]]
    title = "TIM / CladAG Churn Classification Challenge"
    domain = "Telco churn prediction"
    description = "Designed a classification workflow to identify at-risk customers, with feature engineering and robust validation for leaderboard performance."
    result = "Won the competition for TIM, Italy's largest mobile operator."

  [[params.selectedWork]]
    title = "Kaggle Modeling Portfolio"
    domain = "Applied machine learning experimentation"
    description = "Published notebooks that explore real datasets and train both gradient boosting and neural network models with reproducible evaluation flows."
    result = "Reached Kaggle Notebooks Master with a career high of #1 in Italy and #163 worldwide."
    linkText = "View Kaggle code"
    linkUrl = "https://www.kaggle.com/tomwarrens/code"

  [[params.selectedWork]]
    title = "LightGBM Inference-Time Feature Importance"
    domain = "Model interpretability for tree-based models"
    description = "Proposed and implemented a practical approach to compute feature importance at inference time for production tree models."
    result = "Published both an open-source repository and a technical Medium article."
    linkText = "GitHub repository"
    linkUrl = "https://github.com/tomwarrens/lightgbm_inference_fi"
    extraLinkText = "Read the article"
    extraLinkUrl = "https://medium.com/@guerrinitom/run-for-your-leaves-a-simple-path-to-feature-importance-at-inference-time-in-tree-based-models-63afaf5a8c77"

  [params.feasibilitySprint]
    enabled = false
    title = "1-Week Model Feasibility Sprint"
    description = "Send a sample dataset and target definition. In one week, you receive a baseline model, error analysis, and concrete next-step roadmap."
    ctaText = "Apply via email"
    ctaUrl = "mailto:guerrinitom@gmail.com?subject=1-week%20model%20feasibility%20sprint"
    secondaryText = "Book a 20-min call"
    secondaryUrl = "https://calendly.com/tommaso-guerrini-cardoai/30min"
    requirements = [
      "Business objective and decision context",
      "Target definition and success metric",
      "Sample dataset schema (or representative extract)",
      "Constraints: timeline, deployment, and compliance",
    ]
    deliverables = [
      "Baseline model with transparent evaluation",
      "Error analysis and feature-level insights",
      "Risk and data-quality assessment",
      "Recommended production roadmap and next experiments",
    ]

